# =========================================================
# Calibrazione dei modelli sugli inverni passati
#   confronta le previsioni passate (Open-Meteo) con la neve misurata
#   dalle stazioni e salva calibrazione.json nel ramo "dati".
#   Parte a mano (Run workflow) e il 1° di ogni mese. Il primo giro dura circa un'ora;
#   gli inverni conclusi vengono salvati (calibrazione-cache/) e i giri successivi
#   ricalcolano solo l'inverno in corso (pochi minuti).
#   Dal giro orario successivo il sito usa i nuovi fattori.
# =========================================================
name: Calibra i modelli
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 1 * *"      # il 1° del mese alle 3:23 UTC
permissions:
  contents: write
concurrency:
  group: calibra              # gira in parallelo all'aggiornamento orario, che così non resta fermo
  cancel-in-progress: false
jobs:
  calibra:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepara la cartella dell'archivio (ramo "dati")
        run: |
          if git ls-remote --exit-code --heads origin dati >/dev/null 2>&1; then
            git fetch --depth=1 origin dati:dati
            git worktree add archivio dati
          else
            git worktree add --orphan -b dati archivio
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Calcola la calibrazione
        timeout-minutes: 100      # se serve più tempo, il passo si ferma ma gli inverni già fatti vengono salvati
        env:
          ARCHIVIO_DIR: archivio
        run: node scripts/calibra.mjs

      - name: Salva nel ramo dati
        if: always()              # salva anche se il calcolo si è interrotto: il prossimo giro riparte da lì
        run: |
          cd archivio
          git add -A
          if git diff --cached --quiet; then echo "Nessuna novità"; exit 0; fi
          git -c user.name="freeride-bot" -c user.email="freeride-bot@users.noreply.github.com" commit -q -m "Calibrazione $(date -u +%F)"
          # se nel frattempo l'aggiornamento orario ha salvato l'archivio, ci mettiamo in coda ai suoi commit
          for i in 1 2 3; do
            git push origin HEAD:dati && exit 0
            git -c user.name="freeride-bot" -c user.email="freeride-bot@users.noreply.github.com" pull --rebase origin dati
          done
          exit 1
